name: tourist_guide_app
description: "Tourist guide app where users can discover and save their favorite sights"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  lottie: ^3.6.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  get_it: ^9.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_foreground: assets/icon/app_icon.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_background: "#D17438"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#D17438"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
